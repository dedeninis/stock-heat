# 資料來源設定（docs/03 §4.2）
# 以下 RSS/selector 已對真實站台驗證（2026-06-29）。
# 合規：僅讀取公開 RSS 與文章頁、低頻率、可識別 UA；上線前請再確認各站 robots 與授權。
news:
  - id: news.cna
    name: 中央社
    rss: https://feeds.feedburner.com/rsscna/finance
    article_selector: "div.paragraph"
    weight: 0.9
    interval: 600
    enabled: true
    max_per_run: 8

  - id: news.ltn
    name: 自由時報財經
    rss: https://news.ltn.com.tw/rss/business.xml
    article_selector: "div.text"
    weight: 0.8
    interval: 600
    enabled: true
    max_per_run: 8

  - id: news.cnyes
    name: 鉅亨網
    rss: https://news.cnyes.com/rss/v1/news/category/tw_stock
    # 內文容器為動態 hash class（易隨改版失效），改用通用退場抽取（穩定）
    article_selector: null
    weight: 1.0
    interval: 300
    enabled: true
    max_per_run: 8

  - id: news.udn_money
    name: 經濟日報
    rss: https://money.udn.com/rssfeed/news/1001/5591?ch=money
    article_selector: "#article_body"
    weight: 0.9
    interval: 300
    enabled: true    # 已驗證可靜態抓取；selector 失效時 fallback 至 RSS 摘要
    max_per_run: 8

  - id: news.ettoday
    name: ETtoday財經
    rss: https://feeds.feedburner.com/ettoday/finance
    article_selector: "div.story"
    weight: 0.7
    interval: 600
    enabled: true
    max_per_run: 8

  - id: news.yahoo
    name: Yahoo股市
    rss: https://tw.stock.yahoo.com/rss/url/d/e/N1.html
    article_selector: "div.caas-body"
    weight: 0.7
    interval: 600
    enabled: true
    max_per_run: 8

  - id: news.technews
    name: TechNews科技新報
    rss: https://technews.tw/feed/
    article_selector: "article"
    weight: 0.6
    interval: 900
    enabled: true
    max_per_run: 6
