# 資料來源設定（docs/03 §4.2）
# selector 與 rss URL 需以實際頁面驗證；設計上以「可設定」為原則。
news:
  - id: news.cnyes
    name: 鉅亨網
    rss: https://news.cnyes.com/rss/v1/news/category/tw_stock
    article_selector: "main article"
    weight: 1.0
    interval: 300
    enabled: true

  - id: news.cna
    name: 中央社財經
    rss: https://feeds.feedburner.com/rsscna/finance
    article_selector: "div.paragraph"
    weight: 0.9
    interval: 600
    enabled: true

  - id: news.udn_money
    name: 經濟日報
    list_url: https://money.udn.com/money/cate/5590
    article_selector: "section#article_body"
    weight: 1.0
    interval: 300
    enabled: false   # 列表頁解析待實作驗證，預設停用
