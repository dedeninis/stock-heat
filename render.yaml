# Render Blueprint：一鍵部署後端 API（https://render.com）
# 連結 GitHub repo 後，Render 會依此檔建立服務。
services:
  - type: web
    name: stock-heat-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: STOCKHEAT_USE_DB
        value: "1"
      - key: STOCKHEAT_SEED_ON_START
        value: "1"        # 免費方案磁碟重啟即清空，啟動時灌示範資料讓畫面有東西
      - key: STOCKHEAT_CORS_ORIGINS
        value: "*"        # 唯讀 API；要收緊可填 https://<你的帳號>.github.io
